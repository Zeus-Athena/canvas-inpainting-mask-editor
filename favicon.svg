<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brushGrad" x1="80" y1="420" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="100" y1="400" x2="400" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#0b1120" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="8" opacity="0.6" />

  <!-- Canvas Guidelines / Grid lines -->
  <g stroke="#334155" stroke-width="6" stroke-dasharray="14 12" opacity="0.45">
    <!-- Inner frame -->
    <rect x="76" y="76" width="360" height="360" rx="36" fill="none" />
  </g>

  <!-- Glow under the brush stroke -->
  <path d="M 110 390 C 180 370, 210 280, 270 230 C 330 180, 370 140, 400 110" 
        fill="none" stroke="url(#glowGrad)" stroke-width="96" stroke-linecap="round" filter="url(#glow)" />

  <!-- Main Diagonal Inpainting Mask Brush Stroke -->
  <path d="M 120 380 C 185 360, 215 285, 275 235 C 330 190, 365 145, 395 115" 
        fill="none" stroke="url(#brushGrad)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Secondary Mask Highlights (Layered brush feathering effect) -->
  <path d="M 155 350 C 205 330, 230 270, 280 230 C 325 195, 350 160, 375 135" 
        fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.4" />

  <!-- CleanerPix Signature Cyan Star Sparkle in Top-Right -->
  <g transform="translate(390, 80) scale(1.1)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#38bdf8" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Small secondary sparkle -->
  <g transform="translate(100, 140) scale(0.6)">
    <path d="M 0 -20 Q 0 0 20 0 Q 0 0 0 20 Q 0 0 -20 0 Q 0 0 0 -20 Z" fill="#a855f7" opacity="0.8" />
  </g>
</svg>